<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Más Humanidad en Cada Parada</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif}
.hero-overlay{background:linear-gradient(rgba(15,23,42,.70),rgba(15,23,42,.75))}
html{scroll-behavior:smooth}
</style>
</head>
<body class="bg-slate-50 text-slate-800">

<section id="contacto" class="py-24 bg-white">
<div class="max-w-3xl mx-auto px-6">
<div class="text-center mb-12">
<h2 class="text-4xl font-bold mb-4">Contacta con nosotros</h2>

<p class="text-slate-600 text-lg leading-relaxed">
Déjanos tus datos y comentarios sobre la estación de servicio.<br>
Te responderemos lo antes posible.<br>
<strong>¡Muchas gracias por tu aportación!</strong>
</p>

</div>

<form id="contactForm" class="bg-slate-50 p-8 rounded-3xl shadow-lg space-y-6">
<input type="text" name="nombre" placeholder="Nombre completo" required class="w-full border border-slate-300 rounded-xl px-4 py-3">
<input type="email" name="email" placeholder="Correo electrónico" required class="w-full border border-slate-300 rounded-xl px-4 py-3">
<input type="tel" name="telefono" placeholder="Teléfono" class="w-full border border-slate-300 rounded-xl px-4 py-3">
<textarea name="mensaje" rows="5" placeholder="Escribe aquí tu comentario..." class="w-full border border-slate-300 rounded-xl px-4 py-3"></textarea>

<button id="submitBtn" type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-2xl transition">
Enviar comentario
</button>

<p id="respuesta" class="text-center font-semibold mt-4"></p>
</form>
</div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
emailjs.init({publicKey:"1H4tg07C5GaF8y_qD"});
const f=document.getElementById("contactForm"),b=document.getElementById("submitBtn"),r=document.getElementById("respuesta");
f.addEventListener("submit",function(e){
e.preventDefault();
b.disabled=true;
b.innerHTML="⏳ Enviando...";
emailjs.sendForm("service_m254vnq","template_1cphleo",this)
.then(()=>{
r.innerHTML="✅ ¡Gracias! Hemos recibido correctamente tu comentario.";
r.className="text-center font-semibold mt-4 text-green-600";
f.reset();
})
.catch(()=>{
r.innerHTML="❌ Ha ocurrido un error. Inténtalo de nuevo.";
r.className="text-center font-semibold mt-4 text-red-600";
})
.finally(()=>{
b.disabled=false;
b.innerHTML="Enviar comentario";
});
});
</script>
</body>
</html>
